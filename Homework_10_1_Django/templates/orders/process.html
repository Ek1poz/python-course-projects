{% extends "books/base.html" %}
{% load i18n %}
{% block content %}
<div style="max-width: 500px; margin: 50px auto; text-align: center; background-color: #f8f9fa; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h2>{% blocktranslate with order_id=order.id %}Payment for Order #{{ order_id }}{% endblocktranslate %}</h2>
    
    <p style="font-size: 18px; margin: 20px 0;">{% translate "Amount to pay:" %} <strong>${{ order.get_total_cost }}</strong></p>
    
    <form action="{% url 'books:payment_process' order.id %}" method="post">
        {% csrf_token %}
        <button type="submit" style="background-color: #198754; color: white; font-size: 18px; padding: 15px; width: 100%; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px;">
            {% translate "Pay with Stripe" %}
        </button>
    </form>
    
    <a href="{% url 'books:book_list' %}" style="color: #dc3545; text-decoration: underline;">{% translate "Cancel and Return" %}</a>
</div>
{% endblock %}
