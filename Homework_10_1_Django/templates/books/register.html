{% extends 'books/base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <h2 class="text-center mb-4">{% translate "Register" %}</h2>
        <form method="post" class="card p-4 shadow-sm">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">{% translate "Create Account" %}</button>
        </form>
        <div class="text-center mt-3">
            <p>{% translate "Already have an account?" %} <a href="{% url 'books:login' %}">{% translate "Login here" %}</a></p>
        </div>
    </div>
</div>
{% endblock %}
