<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'books:book_list' %}">Django Store</a>
        <div>
            <a class="btn btn-outline-light me-2" href="{% url 'books:book_create' %}">Add Book</a>

            {% if request.user.is_authenticated %}
                <span class="text-white me-3">Hello, {{ request.user.username }}!</span>
                <form action="{% url 'books:logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger">Logout</button>
                </form>
            {% else %}
                <a class="btn btn-outline-info me-2" href="{% url 'books:login' %}">Login</a>
                <a class="btn btn-outline-warning" href="{% url 'books:register' %}">Register</a>
            {% endif %}
        </div>
    </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
