{% extends 'books/base.html' %}

{% block content %}
<h2>{{ book.title }}</h2>
<p><strong>Author:</strong> {{ book.author }}</p>
<p><strong>Price:</strong> {{ book.price }}</p>
<p><strong>Stock:</strong> {{ book.stock }}</p>
<a href="{% url 'books:book_list' %}" class="btn btn-primary">Back to list</a>
{% endblock %}
