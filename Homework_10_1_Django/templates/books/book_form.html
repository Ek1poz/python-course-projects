{% extends 'books/base.html' %}
{% load i18n %}

{% block content %}
<h2>{% if object %}{% translate "Edit Book" %}{% else %}{% translate "Create Book" %}{% endif %}</h2>
<form method="post" class="mt-3 w-50">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">{% translate "Save" %}</button>
    <a href="{% url 'books:book_list' %}" class="btn btn-secondary">{% translate "Cancel" %}</a>
</form>
{% endblock %}
